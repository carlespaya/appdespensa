# Compila el APK firmado y lo publica como GitHub Release al subir una etiqueta v1.2.3.
# La app consulta la última release al abrirse y ofrece actualizar (los datos se conservan
# porque todas las versiones se firman con la misma clave).
#
#   git tag -a v1.1.0 -m "Novedades de esta versión"
#   git push origin v1.1.0
name: Publicar APK

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Versión desde la etiqueta
        run: node scripts/set-version.js "$GITHUB_REF_NAME"

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "Falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Comprobar firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i "CN=Despensa"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "Despensa-$VERSION.apk"
          # checkout deja la etiqueta como ligera: se vuelve a traer para leer su mensaje (las novedades).
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "$NOTES" ]; then NOTES="Despensa $VERSION"; fi
          gh release create "$GITHUB_REF_NAME" "Despensa-$VERSION.apk" --title "Despensa $VERSION" --notes "$NOTES"
